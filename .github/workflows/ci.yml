name: CI

on:
  push:
    branches: [ "main", "master", "fix/*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Linting Tools
      run: |
        npm install -g htmlhint eslint

    - name: Run HTMLHint
      run: |
        htmlhint "*.html" || echo "HTML validation warnings found"

    - name: Run ESLint
      run: |
        eslint widget.js --env browser || echo "ESLint warnings found"
